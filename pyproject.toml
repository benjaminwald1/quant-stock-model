[project]
name = "qsm"
version = "0.1.0"
description = "Quantitative equity forecasting and backtesting on Kaggle daily OHLCV data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "kaggle>=1.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
nn = ["torch>=2.2"]
live = ["yfinance>=0.2"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
qsm = "qsm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
